name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Every port on every case, in the four languages, with panir checked out
  # beside this repository as in development (its main: the ports follow
  # panir, whose API may change).
  test:
    runs-on: ubuntu-latest
    env:
      # pantable's ports read their block headers and run after the include
      # step: pandoc's release binary, and panclude.lua at a pinned commit
      PANDOC_VERSION: "3.14"
      PANCLUDE_COMMIT: aa6a0d53bbdf1209092733b59efb5220d6e46ff6
    defaults:
      run:
        working-directory: panir-filters
    steps:
      - uses: actions/checkout@v7
        with:
          path: panir-filters
      - uses: actions/checkout@v7
        with:
          repository: ickc/panir
          path: panir
      # (its sources, for pyright: the Python ports' calls into pandoc)
      - uses: actions/checkout@v7
        with:
          repository: ickc/libpandoc-python
          path: libpandoc-python
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panir-filters
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: panir's TypeScript package, built
        working-directory: panir/ts
        run: npm ci && npm run build
      - name: pandoc ${{ env.PANDOC_VERSION }} and panclude.lua
        run: |
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-linux-amd64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-$PANDOC_VERSION/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/panclude.lua" "https://raw.githubusercontent.com/ickc/panclude/$PANCLUDE_COMMIT/panclude.lua"
          echo "PANCLUDE=$RUNNER_TEMP/panclude.lua" >> "$GITHUB_ENV"
      - name: Set up the ports
        run: |
          npm ci
          julia --project=. -e 'using Pkg; Pkg.instantiate(); using Panir'
      - name: Check the ports
        run: |
          npm run check  # tsc and pyright
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          cargo clippy --release --target wasm32-wasip1 -- -D warnings  # (the ports built as wasm filters, calling the host's pandoc)
          cargo test --release  # (amsthm's cases with the writer's options, in process)
          python3 auto-lang/tables.py --check  # (its tables as made from the original's)
      - name: The cases
        run: python3 run.py test
