# One workspace for every Rust port: `cargo build --release` (run.py does),
# each port a binary named as its filter, in target/release.
[workspace]
members = ["*/rust"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
# panir's checkout beside this one, while panir isn't published
panir = { path = "../panir/rust" }
serde_json = "1"
# libpandoc-rs's main (for the filters that call pandoc, built for wasm: its
# guest side, which needs no libpandoc to build)
libpandoc = { git = "https://github.com/ickc/libpandoc-rs", rev = "cdd1f3ab52f6ff88c6d647fc3a453ee504267c47" }

# libpandoc's panir is the one beside this repository too
[patch."https://github.com/ickc/panir"]
panir = { path = "../panir/rust" }
