[package]
name = "pantable"
description = "Code blocks of class table, CSV with a YAML header of options, made tables: a pandoc filter (a port of ickc/pantable)"
license = "BSD-3-Clause"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
panir.workspace = true
# the plain data of a list of options (panir's Options::list)
serde_json.workspace = true
# the CSV (Python's csv module in the original)
csv = "1"
# a cell's first line, and the first column of a fancy table
regex = "1"

# pandoc's reader for the header and markdown cells, the host's: built for wasm, libpandoc's
# calls go to the program running the filter
[target.'cfg(target_family = "wasm")'.dependencies]
libpandoc.workspace = true
